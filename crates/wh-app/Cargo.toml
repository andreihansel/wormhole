[package]
name = "wh-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wh-core = { path = "../wh-core" }
wh-vault = { path = "../wh-vault" }
wh-ssh = { path = "../wh-ssh" }
wh-session = { path = "../wh-session" }
russh = { version = "0.64", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
russh = { version = "0.64", default-features = false, features = ["ring"] }
